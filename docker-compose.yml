name: mispisit-vrazhkin

services:
  app:
    image: nikitavrazhkin/mispisit-lab1:0.0.4
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U app -d app
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  dbdata:
